name: CI/CD Pipeline for Backend

on:
  push:
    branches:
      - dev
    paths:
      - backend/**
      - .github/workflows/*-backend.yml

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "liberica"
          java-version: 21
          cache: "maven"

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean install -DskipTests

      # - name: Create .env file from secrets
      #   working-directory: ./backend
      #   run: |
      #     echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
      #     echo "DBMS_CONNECTION=${{ secrets.DBMS_CONNECTION }}" >> .env
      #     echo "API_SECRET_CLOUDINARY=${{ secrets.API_SECRET_CLOUDINARY }}" >> .env
      #     echo "SECRET_KEY_VNPAY=${{ secrets.SECRET_KEY_VNPAY }}" >> .env
      #     echo "TOKEN_GHN=${{ secrets.TOKEN_GHN }}" >> .env
      #     echo "API_KEY_BREVO=${{ secrets.API_KEY_BREVO }}" >> .env
      #     echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
      #     echo "KAFKA_SERVER=${{ secrets.KAFKA_SERVER }}" >> .env
      #     echo "KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${{ secrets.KAFKA_CFG_CONTROLLER_QUORUM_VOTERS }}" >> .env
      #     echo "KAFKA_CFG_LISTENERS=${{ secrets.KAFKA_CFG_LISTENERS }}" >> .env
      #     echo "KAFKA_CFG_ADVERTISED_LISTENERS=${{ secrets.KAFKA_CFG_ADVERTISED_LISTENERS }}" >> .env
      #     echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
      #     echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
      #     echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
      #     echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env

      - name: Login to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set tag for Docker image
        id: set-tag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG="version_${SHORT_SHA}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker Image and Push with Docker CLI
        working-directory: ./backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/green-shop:${{ steps.set-tag.outputs.TAG }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/green-shop:${{ steps.set-tag.outputs.TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: Login to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /projects/green-shop

            # Update TAG in file .env
            grep -v '^TAG=' .env > .env.tmp || true
            echo "TAG=${{ needs.build-and-push.outputs.TAG }}" >> .env.tmp
            mv .env.tmp .env
            
            # Stop only the app service
            docker-compose stop app
            docker-compose rm -f app

            # Pull only the app image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/green-shop:${{ needs.build-and-push.outputs.TAG }}

            # Update docker-compose.yml with new tag for app service
            sed -i "s|image:.*green-shop.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/green-shop:${{ needs.build-and-push.outputs.TAG }}|" docker-compose.yml
            
            # Start only the app service
            docker-compose up -d app
            
            # Clean up only unused app images
            docker image prune -f --filter "label=app=green-shop" 
